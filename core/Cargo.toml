[package]
name = "dpg-core"
version = "0.1.0"
edition = "2021"
description = "DPG 全屏 OCR 识别翻译内核 - 检测/识别/方向分类/截屏"
license = "MIT"

[lib]
name = "dpg_core"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "dpg-cli"
path = "src/bin/dpg_cli.rs"

[dependencies]
# ONNX Runtime 绑定 (rc.14 对应 ONNX Runtime 1.31)
ort = { version = "=2.0.0-rc.14", default-features = false, features = ["std", "load-dynamic"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff", "gif"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
once_cell = "1"
thiserror = "2"
# 离线翻译用的分词器。默认 features 会拉 oniguruma(C 库) + esaxx(C++),
# 这里全部关闭, 改用纯 Rust 的 fancy-regex (可选依赖会生成同名隐式 feature);
# Precompiled 归一化在加载时替换成 NFKC (见 translate.rs)。
# esaxx 只用于训练, 不需要。这样 Windows 与 Android 都不需要额外 C 工具链。
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }

[target.'cfg(windows)'.dependencies]
# Windows 截屏使用原生 GDI, 不引入额外 crate (手写 FFI)

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1
